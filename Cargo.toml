[workspace]
members = [
    "crates/easyh-render",
    "crates/mnir-cli",
    "crates/mnir-core",
    "crates/mnir-verify",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
easyh-render = { path = "crates/easyh-render" }
getrandom = "0.3"
mnir-core = { path = "crates/mnir-core" }
mnir-verify = { path = "crates/mnir-verify" }
